<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessments - PEMDILID Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="/admin/admin-styles.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h4>PEMDILID Admin</h4>
            <small style="color: rgba(255,255,255,0.6);">Phase 2 Dashboard</small>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/admin/dashboard.html"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
            <li><a href="/admin/users.html"><i class='bx bxs-user'></i> User Management</a></li>
            <li><a href="/admin/assessments.html" class="active"><i class='bx bxs-file-doc'></i> Assessments</a></li>
            <li><a href="/admin/indicators.html"><i class='bx bxs-bullseye'></i> Indicators</a></li>
            <li><a href="/admin/responses.html"><i class='bx bxs-message-square-detail'></i> Responses</a></li>
            <li><a href="/admin/reports.html"><i class='bx bxs-report'></i> Reports</a></li>
            <li><a href="/admin/activity-logs.html"><i class='bx bxs-time'></i> Activity Logs</a></li>
            <li><a href="/admin/settings.html"><i class='bx bxs-cog'></i> Settings</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <nav class="top-navbar">
            <div><h5 style="margin: 0; font-weight: 600;">Assessment Management</h5></div>
            <div><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class='bx bx-log-out'></i> Logout</button></div>
        </nav>

        <div class="content-area">
            <div class="card">
                <div class="card-body text-center py-5">
                    <i class='bx bxs-file-doc' style="font-size: 64px; color: #cbd5e1;"></i>
                    <h3 class="mt-3">Assessment Management</h3>
                    <p class="text-muted">Coming in Phase 2B - Assessment CRUD functionality</p>
                    <a href="/admin/dashboard.html" class="btn btn-primary mt-3"><i class='bx bx-arrow-back'></i> Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function logout() { if (confirm('Logout?')) { localStorage.removeItem('admin_token'); sessionStorage.removeItem('admin_token'); window.location.href = '/admin/login.html?logout=true'; } }
        if (!localStorage.getItem('admin_token') && !sessionStorage.getItem('admin_token')) window.location.href = '/admin/login.html';
    </script>
</body>
</html>
