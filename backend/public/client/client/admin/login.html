<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PEMDILID</title>
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #21808D;
            --primary-hover: #1d7480;
            --primary-active: #1a6873;
            --background: #FCFCF9;
            --surface: #FFFFFD;
            --text-primary: #13343B;
            --text-secondary: #626C71;
            --border-color: rgba(94, 82, 64, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #13343B 0%, #21808D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(33, 128, 141, 0.2) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.1);
            padding: 48px 40px;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 14px;
            background: var(--surface);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(33, 128, 141, 0.1);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 15px;
            margin-top: 24px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(33, 128, 141, 0.3);
        }

        .btn-login:active {
            background: var(--primary-active);
            transform: translateY(0);
        }

        .alert {
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        .alert-danger {
            background: rgba(192, 21, 47, 0.1);
            color: #C0152F;
        }

        .alert-success {
            background: rgba(33, 128, 141, 0.1);
            color: var(--primary-color);
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            background: var(--surface);
            padding: 0 16px;
            position: relative;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .form-check-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .form-check-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(33, 128, 141, 0.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><i class='bx bxs-lock-alt'></i> Admin Login</h1>
                <p>Sign in to access the admin dashboard</p>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="admin@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class='bx bx-log-in'></i> Sign In
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="back-link">
                <a href="/index.html">
                    <i class='bx bx-arrow-back'></i> Back to Assessment
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Show loading
            showAlert('info', 'Signing in...');

            try {
                const response = await fetch(`${API_URL}/auth/jwt/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Check if user is admin or super_admin
                    const allowedRoles = ['admin', 'super_admin'];
                    if (!allowedRoles.includes(data.data.user.role)) {
                        showAlert('danger', 'Access denied. Admin privileges required.');
                        return;
                    }

                    // Store token
                    if (rememberMe) {
                        localStorage.setItem('admin_token', data.data.access_token);
                    } else {
                        sessionStorage.setItem('admin_token', data.data.access_token);
                    }

                    // Store user info
                    localStorage.setItem('admin_user', JSON.stringify(data.data.user));

                    showAlert('success', 'Login successful! Redirecting...');
                    
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard.html';
                    }, 1000);

                } else {
                    showAlert('danger', data.message || 'Login failed. Please check your credentials.');
                }

            } catch (error) {
                console.error('Login error:', error);
                showAlert('danger', 'Connection error. Please check if the backend server is running.');
            }
        });

        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type}" role="alert">
                    ${message}
                </div>
            `;
        }

        // Check if already logged in
        const urlParams = new URLSearchParams(window.location.search);
        const forceLogout = urlParams.get('logout');
        
        if (forceLogout) {
            localStorage.removeItem('admin_token');
            sessionStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.history.replaceState({}, '', '/admin/login.html');
        } else {
            const token = localStorage.getItem('admin_token') || sessionStorage.getItem('admin_token');
            if (token) {
                window.location.href = '/admin/dashboard.html';
            }
        }
    </script>
</body>
</html>
